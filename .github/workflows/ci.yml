name: MNI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Reproduce all scientific artifacts
        run: python scripts/run_all.py
      - name: Verify generated artifacts
        run: |
          test -f results/summary.csv
          test -f results/threshold_sweep.csv
          test -f results/robustness_suite.csv
          test -f results/heterogeneity_suite.csv
          test -f results/ablation_suite.csv
          test -f results/episode_trace.csv
          test -f results/multiseed_summary.csv
          test -f results/multiseed_raw.csv
          test -f results/pareto_frontier.csv
          test -f results/longitudinal_learning.csv
          test -f results/paper_gate_checks.csv
      - name: Fail if any pre-paper gate fails
        run: |
          python - <<'PY'
          import pandas as pd
          g=pd.read_csv('results/paper_gate_checks.csv')
          if not g['passed'].astype(str).str.lower().eq('true').all():
              print(g.to_string(index=False))
              raise SystemExit('One or more pre-paper evidence gates failed')
          print(g.to_string(index=False))
          PY
      - name: Upload complete result artifact
        uses: actions/upload-artifact@v4
        with:
          name: mni-v1-evidence-results
          path: results/
